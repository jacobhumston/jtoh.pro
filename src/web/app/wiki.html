<!doctype html>
<html lang="en">
    <head data-page="Wiki">
        <template data-name="head"></template>
        <template data-name="meta"></template>
    </head>
    <body>
        <template data-name="headerLinks"></template>
        <div id="container">
            <h1>jtoh.wiki</h1>
            <p>
                Looks like you've stumbled upon a hidden feature!
                <br />
                <li>
                    <code>jtoh.wiki</code>
                    allows you to create short urls that redirect to a specific page on the community-ran jtoh wiki.
                </li>
                <li>
                    For example:
                    <code>https://jtoh.wiki/Ring_1</code>
                    will redirect you to
                    <code>https://jtoh.fandom.com/wiki/Ring_1</code>
                </li>
            </p>
            <template data-name="footer"></template>
        </div>
    </body>
</html>
