<!doctype html>
<html lang="en">
    <head data-page="Badges">
        <template data-name="head"></template>
        <template data-name="meta"></template>
    </head>
    <body>
        <template data-name="header-links"></template>
        <div id="container">
            <h1>Badges</h1>
            <p>Check your badge progress across all tracked games.</p>
            <div class="interactionFlex">
                <input type="text" id="loadBadgesUsername" placeholder="Roblox Username" />
                <button type="button" id="loadBadges">
                    <span class="materialSymbolsRounded">award_star</span>
                    Load Badges
                </button>
            </div>
            <div id="progressBar">
                <div id="progressBarFill"></div>
            </div>
            <div id="badgeStatBar"></div>
        </div>
        <div id="badgesContainer"></div>
        <div class="backupContainer">
            <template data-name="footer"></template>
        </div>
    </body>
</html>
